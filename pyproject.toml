[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instastatus-analyzer"
version = "0.2.0"
description = "Instagram account engagement and follower-quality analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikhil Tomar" }]
dependencies = [
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
instagram = ["instagrapi>=2.1.2"]
api = ["fastapi>=0.111.0", "uvicorn[standard]>=0.30.1"]
dashboard = ["pandas>=2.2.2", "plotly>=5.22.0", "streamlit>=1.36.0"]
pdf = ["reportlab>=4.2.0"]
ml = ["joblib>=1.4.2", "scikit-learn>=1.5.0"]
dev = ["pytest>=8.2.0", "pytest-mock>=3.14.0", "ruff>=0.5.0"]
all = [
    "fastapi>=0.111.0",
    "instagrapi>=2.1.2",
    "joblib>=1.4.2",
    "pandas>=2.2.2",
    "plotly>=5.22.0",
    "reportlab>=4.2.0",
    "scikit-learn>=1.5.0",
    "streamlit>=1.36.0",
    "uvicorn[standard]>=0.30.1",
]

[project.scripts]
instastatus = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
